# cf-knowledge-kiln pre-commit configuration.
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# Skip:    SKIP=gitleaks git commit ...
#
# Versions pinned. Reviewed periodically. Aligns with homelab-iac and
# bosh-pgvector-release where the same hook is used.

repos:
  # ─── Secrets scanning ───────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
            \.venv/.*|
            tests/fixtures/.*|
            plans/.*|
            .*\.lock|
            \.git/.*|
            src/cf_knowledge_kiln/api/static/vendor/.*
          )$

  # ─── Generic hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Vendored third-party assets are byte-for-byte upstream; an
        # appended newline breaks the SRI hash on htmx.
        exclude: ^src/cf_knowledge_kiln/api/static/vendor/.*
      - id: end-of-file-fixer
        exclude: ^src/cf_knowledge_kiln/api/static/vendor/.*
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: forbid-submodules
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks

  # ─── YAML / shell / markdown linting ────────────────────────────────
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]
        types: [yaml]
        # Skip CF manifest and docker compose until we settle on a style.
        exclude: ^(manifest\.yml|docker-compose\.yml)$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --external-sources]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-2
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -bn, -w, -ln, bash]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        # plans/ is upstream-style; .venv/ has installed-package READMEs.
        exclude: ^(plans/|node_modules/|\.venv/)

  # ─── Python ────────────────────────────────────────────────────────
  # Pinned to match the version CI installs via pyproject (>=0.7,<1.0).
  # Issue #70: keep in sync so pre-commit doesn't reformat against CI's
  # preferences.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9
          - pydantic-settings>=2.5
          - types-PyYAML
          - fastapi>=0.115
          - "uvicorn[standard]>=0.32"
          - structlog>=24.4
          - httpx>=0.27
          # Phase 2 (db) extras — keep in sync with [project.optional-dependencies.db]
          - asyncpg>=0.30
          - sqlalchemy>=2.0
          - alembic>=1.13
          - pgvector>=0.3
        args: [--config-file=pyproject.toml]
        files: ^src/

  # ─── Python security ────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]
        # bandit hits its own deps if pointed at .venv; scan source only.
        files: ^src/

  # ─── Local hooks ────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: openapi-lint
        name: validate OpenAPI 3.1 spec
        entry: python3 scripts/lint_openapi.py openapi/openapi.yaml
        language: system
        files: ^openapi/openapi\.yaml$
        pass_filenames: false
