---
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + openapi-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # NOTE: no HuggingFace model cache here yet — neither this `verify`
      # job nor `integration` installs the `[real-embeddings]` extra or
      # sets `KILN_TEST_REAL_EMBEDDINGS=1`, so the cache would store an
      # empty directory. Add it back alongside an opt-in real-embedding
      # job when that runs in CI.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install from lockfile (uv sync --frozen)
        # `--frozen` refuses to update uv.lock — CI fails fast if a PR
        # changed pyproject.toml without running `make lock`. This is the
        # contract that makes the lockfile load-bearing (#194).
        run: uv sync --frozen --extra dev --extra db --extra ingestion --extra oidc

      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (ruff format --check)
        run: ruff format --check src tests

      - name: Typecheck (mypy --strict)
        run: mypy src

      - name: Unit tests (pytest)
        run: pytest tests/unit -q --cov=cf_knowledge_kiln --cov-report=term-missing

      - name: OpenAPI lint
        run: python scripts/lint_openapi.py openapi/openapi.yaml

      - name: cf-verify (deploy-contract static checks)
        # Encodes the lessons from #229/#240/#241/#242/#243 as static
        # checks: manifest sizing + executable scripts + serve-worker
        # invocation + requirements.txt resolves + example yaml loads.
        # Catches the entire class of "looks right, fails at CF
        # staging" regressions in seconds before they hit the live
        # foundation again.
        run: python scripts/cf-verify.py

      - name: kiln.css partials in sync with concatenated artifact
        # The browser-served stylesheet `static/kiln.css` is a build
        # artifact of the topical partials under `static/kiln/`. CI
        # rebuilds it and fails if the committed file drifted, so the
        # source partials and the served file stay byte-aligned.
        run: |
          make build-css
          git diff --exit-code src/cf_knowledge_kiln/api/static/kiln.css \
            || { echo "::error::kiln.css is out of sync with src/cf_knowledge_kiln/api/static/kiln/*.css. Run 'make build-css' and commit the result."; \
                 exit 1; }

      - name: Security — bandit
        run: bandit -c pyproject.toml -q -r src

      - name: Security — pip-audit
        # --strict refuses to tolerate editable installs even with
        # --skip-editable; we run without strict so our own editable
        # package is silently skipped while every other dep is audited.
        run: pip-audit --skip-editable

  integration:
    name: integration (pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kiln
          POSTGRES_PASSWORD: kiln  # pragma: allowlist secret
          POSTGRES_DB: kiln
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiln -d kiln"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KILN_TEST_DATABASE_URL: postgresql+asyncpg://kiln:kiln@localhost:5432/kiln  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install from lockfile (uv sync --frozen)
        run: uv sync --frozen --extra dev --extra db --extra ingestion --extra oidc

      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Integration tests (pytest)
        run: pytest tests/integration -q

  secrets-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks-action posts a comment on PR scans, so it needs read
    # access to commits and write access to PR comments. Without these
    # the action 403s on /pulls/<n>/commits.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  markdown-lint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !plans/**
            !.venv/**
          config: .markdownlint.json

  # ─── #28 — SBOM + vulnerability scan ─────────────────────────────
  # Generates an SPDX SBOM via syft + scans it via grype. Fails the
  # build on HIGH/CRITICAL findings; warns on MEDIUM/LOW (visible in
  # the grype table output). Uploads the SBOM as a build artifact so
  # operators have a record of every dep in a release.
  sbom-scan:
    name: sbom + grype scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # so future SARIF upload works
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install runtime deps from lockfile
        # syft scans the installed tree; uv sync from the lockfile
        # gives it the exact pinned versions the deploy would use.
        run: uv sync --frozen --extra dev --extra db --extra ingestion --extra oidc
      - name: Add venv to PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: cf-knowledge-kiln-sbom.spdx.json
      - name: Scan SBOM (grype)
        # `fail-build: true` + `severity-cutoff: high` matches the
        # phase-8 hardening policy: HIGH/CRITICAL → CI red, MEDIUM
        # and below stay informational. Operators tune the cutoff
        # for their org's risk appetite in a follow-up PR.
        uses: anchore/scan-action@v7
        id: grype
        with:
          sbom: sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          # Output table to logs AND SARIF for future code-scanning upload.
          output-format: table
          add-cpes-if-none: true
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cf-knowledge-kiln-sbom
          path: sbom.spdx.json
          if-no-files-found: warn
          retention-days: 90
