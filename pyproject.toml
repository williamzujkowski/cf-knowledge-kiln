[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cf-knowledge-kiln"
version = "0.1.0"
description = "Cloud Foundry-ready RAG knowledge substrate. Hybrid search over internal docs; cited human results + bounded agent context packs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "William Zujkowski" }]
keywords = ["rag", "retrieval", "cloud-foundry", "knowledge-base", "pgvector"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "structlog>=24.4,<25.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
db = [
  "asyncpg>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pgvector>=0.3,<1.0",
]
ingestion = [
  "python-frontmatter>=1.1,<2.0",
  "mistune>=3.0,<4.0",
  "tiktoken>=0.8,<1.0",
]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=9.0.3,<10.0",         # 9.0.3 fixes CVE-2025-71176 (caught by pip-audit)
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "httpx>=0.27,<1.0",
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/williamzujkowski/cf-knowledge-kiln"
Issues = "https://github.com/williamzujkowski/cf-knowledge-kiln/issues"
Repository = "https://github.com/williamzujkowski/cf-knowledge-kiln"

[project.scripts]
cf-knowledge-kiln = "cf_knowledge_kiln.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_knowledge_kiln"]

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RET",  # return statements
  "ARG",  # unused arguments
  "PTH",  # pathlib
  "RUF",  # ruff-specific
  "S",    # bandit-lite
  "ASYNC", # async pitfalls
  "FAST", # FastAPI
]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "S105", "S106", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true

# Third-party libs without py.typed markers.
[[tool.mypy.overrides]]
module = ["pgvector.*", "frontmatter.*", "mistune.*", "tiktoken.*"]
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: marks tests that require a real Postgres+pgvector instance",
]

# ─── coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/cf_knowledge_kiln"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ─── bandit ──────────────────────────────────────────────────────────
[tool.bandit]
# Bandit B101 (assert_used) is fine in tests; the per-file ruff config
# already exempts them. Other quality-of-life skips:
skips = [
  "B101",  # assert_used — tests legitimately use asserts
  "B104",  # hardcoded_bind_all_interfaces — cli/serve uses 0.0.0.0 by design
  "B404",  # import_subprocess — ingestion uses subprocess for `git clone`.
  "B603",  # subprocess_without_shell_equals_true — we never use shell=True.
  "B607",  # start_process_with_partial_path — `git` is on every supported host.
]
exclude_dirs = ["tests", ".venv", "build", "dist"]
