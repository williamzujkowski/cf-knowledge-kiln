[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cf-knowledge-kiln"
version = "0.1.0"
description = "Cloud Foundry-ready RAG knowledge substrate. Hybrid search over internal docs; cited human results + bounded agent context packs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "William Zujkowski" }]
keywords = ["rag", "retrieval", "cloud-foundry", "knowledge-base", "pgvector"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
  "structlog>=24.4,<26.0",
  "pyyaml>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  # Phase 6 — Jinja2 server-rendered templates for the human search
  # UI. No build step; HTMX loaded from CDN. See docs/user-journeys.md.
  "jinja2>=3.1,<4.0",
  # FastAPI Form() parameters require python-multipart for the
  # form-encoded body parser. The HTMX search form posts as
  # application/x-www-form-urlencoded.
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
db = [
  "asyncpg>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pgvector>=0.3,<1.0",
]
ingestion = [
  "python-frontmatter>=1.1,<2.0",
  "mistune>=3.0,<4.0",
  "tiktoken>=0.8,<1.0",
]
embeddings = [
  # Heavy: pulls in torch transitively. Only needed for the
  # `local-sentence-transformers` (a.k.a. `local`) embedding provider;
  # the `openai-compatible` and `mock` providers work without this
  # extra. Kept as an alias for back-compat — see `real-embeddings`
  # below.
  "sentence-transformers>=3.0,<6.0",
]
real-embeddings = [
  # Canonical name for the heavy local-inference extra. Mirrors
  # `embeddings` above; both install the same set. `torch` is pulled
  # in transitively by `sentence-transformers` but we pin it explicitly
  # so CI can pre-cache it as a separate layer and so a bad
  # transitive resolution can't silently downgrade past the floor.
  "sentence-transformers>=3.0,<6.0",
  "torch>=2.0,<3",
]
otel = [
  # Optional OpenTelemetry tracing. Enabled only when
  # KILN_OTEL_EXPORTER_OTLP_ENDPOINT is set AND this extra is
  # installed — see api/observability.py. Kept optional so production
  # deploys that don't need tracing don't ship the deps.
  "opentelemetry-api>=1.20,<2.0",
  "opentelemetry-sdk>=1.20,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.40,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.20,<2.0",
]
dev = [
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<3.0",
  "pytest>=9.0.3,<10.0",         # 9.0.3 fixes CVE-2025-71176 (caught by pip-audit)
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<8.0",
  "httpx>=0.27,<1.0",
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/williamzujkowski/cf-knowledge-kiln"
Issues = "https://github.com/williamzujkowski/cf-knowledge-kiln/issues"
Repository = "https://github.com/williamzujkowski/cf-knowledge-kiln"

[project.scripts]
cf-knowledge-kiln = "cf_knowledge_kiln.api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_knowledge_kiln"]

# ─── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # bugbear
  "C4",   # comprehensions
  "UP",   # pyupgrade
  "SIM",  # simplify
  "RET",  # return statements
  "ARG",  # unused arguments
  "PTH",  # pathlib
  "RUF",  # ruff-specific
  "S",    # bandit-lite
  "ASYNC", # async pitfalls
  "FAST", # FastAPI
]
ignore = [
  "E501",  # line length handled by formatter
  "S101",  # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "S105", "S106", "S603", "S607"]
# The eval conftest re-exports integration-suite fixtures by importing
# them (the pytest-supported alternative to `pytest_plugins`, which is
# forbidden outside the rootdir conftest — #170). That pattern trips
# F401 (a re-exported fixture looks unused) and F811 (a fixture consumed
# as a parameter shadows its own re-export) — both false positives here.
"tests/eval/conftest.py" = ["S101", "ARG", "S105", "S106", "S603", "S607", "F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = true
no_implicit_reexport = true
show_error_codes = true

# Third-party libs without py.typed markers, plus optional extras
# whose modules may not be installed (mypy must tolerate the import
# being unresolvable so the optional code path stays type-checkable).
[[tool.mypy.overrides]]
module = [
  "pgvector.*",
  "frontmatter.*",
  "mistune.*",
  "tiktoken.*",
  "sentence_transformers.*",
  "opentelemetry.*",
]
ignore_missing_imports = true

# ─── pytest ──────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: marks tests that require a real Postgres+pgvector instance",
  "eval: marks retrieval-quality evaluation tests (requires Postgres+pgvector and a seeded docs corpus)",
]

# ─── coverage ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/cf_knowledge_kiln"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

# ─── bandit ──────────────────────────────────────────────────────────
[tool.bandit]
# Bandit B101 (assert_used) is fine in tests; the per-file ruff config
# already exempts them. Other quality-of-life skips:
skips = [
  "B101",  # assert_used — tests legitimately use asserts
  "B104",  # hardcoded_bind_all_interfaces — cli/serve uses 0.0.0.0 by design
  "B404",  # import_subprocess — ingestion uses subprocess for `git clone`.
  "B603",  # subprocess_without_shell_equals_true — we never use shell=True.
  "B607",  # start_process_with_partial_path — `git` is on every supported host.
]
exclude_dirs = ["tests", ".venv", "build", "dist"]
