---
# yamllint config — matches homelab-iac style for consistency.
extends: default

rules:
  line-length:
    max: 200
    level: warning
  document-start:
    present: true
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: 2
    indent-sequences: true
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  .venv/
  node_modules/
  .git/
  manifest.yml
