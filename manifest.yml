---
# Cloud Foundry deployment manifest.
#
# Two apps: a request-serving API and an ingestion worker. The worker
# has no route — it pulls work from a queue / cron, not from HTTP.
#
# Bind any standard Postgres service before pushing. The MVP uses
# Postgres FTS only — no pgvector required (ADR-0007). Examples:
#
#   # Via a Postgres broker your foundation exposes:
#   cf create-service <broker> <plan> cf-knowledge-kiln-db
#
#   # Or via a user-provided service:
#   cf cups cf-knowledge-kiln-db -p '{"uri":"postgres://user:pass@host:5432/db"}'
#
#   cf bind-service cf-knowledge-kiln-api    cf-knowledge-kiln-db
#   cf bind-service cf-knowledge-kiln-worker cf-knowledge-kiln-db
#
# Phase 5.5 may add pgvector; if it does, the companion
# bosh-pgvector-release provides the BOSH path for that.
#
# Customize ROUTE_DOMAIN / org-specific values before pushing.

applications:
  - name: cf-knowledge-kiln-api
    memory: 1G
    disk_quota: 1G
    instances: 1
    buildpacks:
      - python_buildpack
    command: ./scripts/start-api.sh
    health-check-type: http
    health-check-http-endpoint: /healthz
    health-check-invocation-timeout: 10
    timeout: 120
    env:
      KILN_ENV: production
      KILN_LOG_LEVEL: INFO
      # KILN_AUTH_MODE intentionally unset — auth middleware lands in
      # Phase 8 (epic #7). Setting `bearer` here today would lie:
      # nothing in src/cf_knowledge_kiln/api/ reads it yet. Until the
      # middleware lands, deploy with care behind a trusted route.
      PYTHONUNBUFFERED: "1"
    services:
      - cf-knowledge-kiln-db

  - name: cf-knowledge-kiln-worker
    memory: 1G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: ./scripts/start-worker.sh
    no-route: true
    health-check-type: process
    env:
      KILN_ENV: production
      KILN_LOG_LEVEL: INFO
      KILN_INGEST_CONCURRENCY: "4"
      PYTHONUNBUFFERED: "1"
    services:
      - cf-knowledge-kiln-db
