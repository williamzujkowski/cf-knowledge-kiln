---
# Cloud Foundry deployment manifest.
#
# Two apps: a request-serving API and an ingestion worker. The worker
# has no route — it pulls work from a queue / cron, not from HTTP.
#
# Bind a pgvector-enabled Postgres service before pushing. The MVP
# uses hybrid retrieval (vector + FTS) per ADR-0002/0008, so the bound
# database must have the `vector` extension installed.
#
# Recommended path on the homelab BOSH foundation:
#
#   cf create-service postgresql-local pgvector cf-knowledge-kiln-db
#
# This uses the cf-local-service-broker pgvector plan against a
# Postgres VM deployed via bosh-pgvector-release. The broker creates
# the database AND runs CREATE EXTENSION vector at provision time.
#
# Deploy gate: blocked on bosh-pgvector-release#3 — the BOSH director
# must have a pgvector-enabled Postgres deployed and registered as a
# CF service before `cf push -f manifest.yml` succeeds end-to-end on
# the homelab foundation.
#
# Local dev and CI work against any pgvector-capable Postgres (e.g.
# `docker run pgvector/pgvector:pg16`).
#
# Customize ROUTE_DOMAIN / org-specific values before pushing.

applications:
  - name: cf-knowledge-kiln-api
    # disk_quota 2G (#242): the buildpack stages sentence-transformers
    # + torch+cpu + the kiln package (~1.3 GB installed). The droplet
    # copy-in step into the runtime cell fails on libtorch_cpu.so
    # extraction at 1G — needs ≥ 1.5G. 2G is the CF foundation default
    # hard cap (cf-deployment's default_app_disk_in_mb); pin at the cap
    # to leave room for the package + a bit of operator debug/logging.
    # Foundations with a higher cap can bump further.
    memory: 1G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: ./scripts/start-api.sh
    health-check-type: http
    health-check-http-endpoint: /healthz
    health-check-invocation-timeout: 10
    timeout: 120
    env:
      KILN_ENV: production
      KILN_LOG_LEVEL: INFO
      # Auth middleware lives in src/cf_knowledge_kiln/api/auth.py
      # (Phase 8 #29). With KILN_ENV=production the API REFUSES TO
      # START unless KILN_AUTH_MODE is set to something safe — set
      # bearer + bind the secret via `cf set-env`:
      #
      #   cf set-env cf-knowledge-kiln-api KILN_AUTH_MODE bearer
      #   cf set-env cf-knowledge-kiln-api KILN_BEARER_TOKEN <secret>
      #   cf restage cf-knowledge-kiln-api
      #
      # Never commit the bearer token to git or the manifest.
      KILN_AUTH_MODE: bearer
      PYTHONUNBUFFERED: "1"
    services:
      - cf-knowledge-kiln-db

  - name: cf-knowledge-kiln-worker
    # memory 2G (#242): the worker loads the embedding model
    # (~134 MB e5 / ~500 MB Nomic), plus the torch+cpu runtime
    # (~500 MB resident), plus batch activations, plus Python.
    # At the previous default of KILN_INGEST_CONCURRENCY=4 the peak
    # hit 1.0-1.4 GB and the 1G cgroup fired with exit 137 on the
    # first batch. 2G clears the embed pass with headroom for a
    # future swap to a larger embedder.
    memory: 2G
    disk_quota: 2G
    instances: 1
    buildpacks:
      - python_buildpack
    command: ./scripts/start-worker.sh
    no-route: true
    health-check-type: process
    env:
      KILN_ENV: production
      KILN_LOG_LEVEL: INFO
      # concurrency 1 (#242): CPU-bound batches don't benefit from
      # concurrency — bandwidth isn't the bottleneck, the model
      # inference is. Higher concurrency just multiplies peak RAM
      # under the 2G cap. Bump back to 4 for high-throughput corpora
      # deployed with more memory.
      KILN_INGEST_CONCURRENCY: "1"
      PYTHONUNBUFFERED: "1"
    services:
      - cf-knowledge-kiln-db
