version: 1
# Hand-labeled `requires_human_review` precision set (#108 item 1).
#
# Corpus: docs/_eval/  (ingested via LocalSource named "kiln-eval")
#
# Schema:
#
#   cases:
#     - case_id: <unique slug>
#       query: <free text>
#       filters: {<RetrievalFilters>}        # optional, default {}
#       expected_review: <bool>              # required — the label
#       expected_reason:                     # optional, narrative
#         <enum>                             # one of:
#         | conflicting_sources
#         | deprecated_source
#         | sensitive_content
#         | prompt_injection_pattern
#         | weak_evidence
#         | empty_result
#         | none
#       relevance:                           # optional, #108 item 2
#         "<repo>/<path>#<H1>/<H2>/...": <0..3>
#       notes: <free text>                   # optional context
#
# Multi-relevance rubric (added for #108 item 2, confidence calibration):
#
#   3 = perfect answer to the query
#   2 = useful, partial
#   1 = tangentially relevant
#   0 = irrelevant
#
# The relevance grades are the median of 5 independent grader subagents
# scoring the actual Nomic Embed v1.5 top-3 chunks per case (#108
# closure). Consensus was strong: 26/33 unanimous, 0/33 with disagree-
# ment spread ≥ 2. Each block is tagged with the consensus marker.
# Re-grade when the corpus or the retriever's top-K behavior shifts.
#
# Scorer (tests/eval/test_review_precision.py): fraction of cases
# where pack.requires_human_review matches the label. Target ≥ 0.85
# in production; under MockEmbeddingProvider the floor is lower —
# see the test for the bootstrap value + the re-baseline plan.
#
# A second scorer (test_confidence_buckets_meet_per_bucket_precision)
# runs only under KILN_EVAL_REAL_EMBEDDINGS=1 and uses the relevance
# grades to assert per-confidence-bucket precision ≥ 0.9.
cases:
  # ─── Should require human review (5) ─────────────────────────

  - case_id: conflict-token-rotation
    query: "bearer token rotation policy cadence operators 90 30 days"
    filters: {status: [active]}
    expected_review: true
    expected_reason: conflicting_sources
    relevance:
      # Consensus-graded by 5 independent judges (median grade per pair).
      # Real-embedding top-3 chunks for query as of 1779178232.4285398.
      "kiln-eval/auth-policy-current.md#Bearer token rotation policy": 3
      "kiln-eval/auth-policy-legacy.md#Bearer token rotation policy": 3
      "kiln-eval/auth-policy-legacy.md#Bearer token rotation policy/Cadence rationale": 2

