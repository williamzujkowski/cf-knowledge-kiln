{# #122: error fragment as margin note. Reuses the .notice voice
   (oxblood left rule, italic, no fill) so failures read as quiet
   editorial annotations rather than chat-app banners. role="alert"
   still announces to AT. #}
<aside class="error-fragment notice notice-alert" role="alert">
  <span class="notice-label" aria-hidden="true">Error</span>
  <em class="error-message">{{ message }}</em>
</aside>
