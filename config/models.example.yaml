---
# Model registry. Copy to config/models.yaml (gitignored) and customize.
# This file is *config*, not code: changing the active model never
# requires a code change.
#
# Secret-bearing fields (api_key) are NEVER in this file. They live in
# environment variables (KILN_EMBEDDING_API_KEY, KILN_GENERATOR_API_KEY)
# or CF service bindings.
#
# Provenance note: the MVP avoids China-origin model families (Qwen,
# DeepSeek, BAAI/BGE). See docs/model-providers.md for the rationale
# and the active allowlist.
#
# MVP scope (ADR-0002, reaffirmed by ADR-0008): hybrid retrieval over
# Postgres + pgvector. The embedding model below is MVP-active.

models:
  embedding:
    provider: local                       # local | local-sentence-transformers | openai-compatible | mock
    name: nomic-embed-text-v1.5
    dimensions: 768
    enabled: true
    notes: |
      Apache 2.0 license. US-origin. Subject to provenance/license
      review per ADR-0005.

  # Alternate: explicit `local-sentence-transformers` provider name.
  # Identical behavior to `local`; the descriptive name is preferred
  # for new configs. Any sentence-transformers-compatible HuggingFace
  # model works — swap `name` to change backends, declare the model's
  # actual output `dimensions`, and (optionally) tune `batch_size` /
  # `device`. Weights cache to ~/.cache/huggingface/ on first use.
  #
  # embedding:
  #   provider: local-sentence-transformers
  #   name: nomic-ai/nomic-embed-text-v1.5   # default; Snowflake/snowflake-arctic-embed-m is an alternative
  #   dimensions: 768                         # arctic-embed-m is also 768
  #   batch_size: 32
  #   device: cpu                             # cpu | cuda | mps; precedence: yaml > KILN_EMBEDDING_DEVICE env > cpu
  #   enabled: true
  #   notes: |
  #     Generic wrapper. Requires the `real-embeddings` extra:
  #       pip install -e '.[real-embeddings]'

  generator:
    provider: openai-compatible           # local | openai-compatible
    name: phi-4-mini-instruct
    base_url_env: KILN_GENERATOR_BASE_URL
    api_key_env: KILN_GENERATOR_API_KEY  # pragma: allowlist secret
    enabled: false                        # Phase 5+ /v1/answer
    default_temperature: 0
    notes: |
      Phi-4-mini-instruct (Microsoft). Disabled in MVP until Phase 5
      lands the /v1/answer synthesis endpoint. Could double as a
      cross-encoder reranker if Phase 5.5 explores that path before
      committing to embeddings.

providers:
  openai_compatible:
    timeout_seconds: 60
    max_retries: 2
