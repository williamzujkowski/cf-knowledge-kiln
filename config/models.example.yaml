---
# Model registry. Copy to config/models.yaml (gitignored) and customize.
# This file is *config*, not code: changing the active model never
# requires a code change.
#
# Secret-bearing fields (api_key) are NEVER in this file. They live in
# environment variables (KILN_EMBEDDING_API_KEY, KILN_GENERATOR_API_KEY)
# or CF service bindings.
#
# Provenance note: the MVP avoids China-origin model families (Qwen,
# DeepSeek, BAAI/BGE). See docs/model-providers.md for the rationale
# and the active allowlist.
#
# MVP scope (ADR-0002, reaffirmed by ADR-0008): hybrid retrieval over
# Postgres + pgvector. The embedding model below is MVP-active.
#
# OUT-OF-THE-BOX BEHAVIOR (#241):
#
# The shipped active provider is ``mock`` so a fresh checkout / first
# CF deploy boots cleanly and the API survives /healthz + /readyz
# without requiring any local model weights or external API. Mock
# vectors are deterministic-but-not-meaningful — they let the kiln
# come up + serve, but retrieval quality is zero. **Operators MUST
# replace this with a real provider for production.** The two real
# options are shown below as commented blocks; uncomment one and
# delete the mock block to swap.

models:
  embedding:
    provider: mock
    name: mock-embedding
    dimensions: 384
    enabled: true
    notes: |
      Out-of-the-box default (#241). Lets the API + worker start
      without weights or network. Replace with one of the commented
      providers below for real retrieval quality.

  # ── Real provider option A: Nomic Embed v1.5 (local-sentence-transformers) ──
  #
  # 768-dim, US-origin, Apache 2.0. Heaviest of the options (~500 MB
  # weights + the torch+cpu runtime). Requires:
  #   pip install -e '.[real-embeddings]' einops
  # einops is the documented Nomic dep (#231). Without it the loader
  # raises a clear ImportError at construction.
  #
  # embedding:
  #   provider: local-sentence-transformers
  #   name: nomic-ai/nomic-embed-text-v1.5
  #   dimensions: 768
  #   batch_size: 32
  #   device: cpu                             # cpu | cuda | mps; precedence: yaml > KILN_EMBEDDING_DEVICE env > cpu
  #   trust_remote_code: true                 # Nomic ships custom modeling code (nomic-bert-2048)
  #   enabled: true
  #   notes: |
  #     Apache 2.0 license. US-origin. Subject to provenance/license
  #     review per ADR-0005.

  # ── Real provider option B: intfloat/e5-small-v2 (local-sentence-transformers) ──
  #
  # 384-dim, US-origin, MIT. Smallest local option (~134 MB weights).
  # No custom modeling code (no einops). Same `[real-embeddings]`
  # extra. The #222 calibration eval found e5-small-v2 keeps pace
  # with Nomic v1.5 on the homelab corpus at much lower memory.
  #
  # embedding:
  #   provider: local-sentence-transformers
  #   name: intfloat/e5-small-v2
  #   dimensions: 384
  #   batch_size: 32
  #   device: cpu
  #   trust_remote_code: false
  #   enabled: true

  generator:
    provider: openai-compatible           # local | openai-compatible
    name: phi-4-mini-instruct
    base_url_env: KILN_GENERATOR_BASE_URL
    api_key_env: KILN_GENERATOR_API_KEY  # pragma: allowlist secret
    enabled: false                        # Phase 5+ /v1/answer
    default_temperature: 0
    notes: |
      Phi-4-mini-instruct (Microsoft). Disabled in MVP until Phase 5
      lands the /v1/answer synthesis endpoint. Could double as a
      cross-encoder reranker if Phase 5.5 explores that path before
      committing to embeddings.

providers:
  openai_compatible:
    timeout_seconds: 60
    max_retries: 2
