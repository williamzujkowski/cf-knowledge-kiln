---
# Security configuration. Copy to config/security.yaml (gitignored).
#
# Controls content filtering during ingestion and warning emission
# during retrieval. None of these settings substitute for proper
# source allowlisting, secret scanning at ingest time, or RBAC at the
# API layer.

content_filters:
  # If a chunk contains any of these phrases (case-insensitive), it is
  # marked with a `prompt_injection_pattern` warning when returned to
  # agent consumers. Ingestion does NOT drop the chunk; humans may
  # still find it useful to read.
  prompt_injection_phrases:
    - "ignore previous instructions"
    - "ignore prior instructions"
    - "disregard the system prompt"
    - "you are now"
    - "developer message"
    - "you must comply"

  # If a chunk matches any of these regexes, it is marked
  # `sensitive_content` and excluded from /v1/agent/* responses by
  # default. Humans see it with a redaction notice.
  sensitive_patterns:
    - 'AKIA[0-9A-Z]{16}'                 # AWS access key id
    - 'xox[baprs]-[0-9a-zA-Z]{10,}'      # Slack tokens
    - 'gh[ps]_[0-9a-zA-Z]{36,}'          # GitHub PAT / installation token

freshness:
  # Documents not reviewed within this many days are flagged
  # `stale_source` in warnings.
  stale_after_days: 365

retrieval:
  # Default ordering preference. Higher = stronger preference.
  status_weights:
    active: 1.0
    approved: 0.95
    draft: 0.5
    deprecated: 0.2
    archived: 0.1
    superseded: 0.05

  # Fused-score floor below which a query trips `weak_evidence` and
  # `requires_human_review`. The hybrid SQL emits a score normalized
  # to [0, 1] (#164): both-arm rank-1 hits land at 1.0, single-arm
  # rank-1 hits at 0.5. `0.46` catches "neither arm matched cleanly"
  # without false-failing single-arm-but-correct results — it's the
  # proportional re-baseline of the pre-#164 raw-scale 0.015 floor
  # (0.015 × 30.5), measured against docs/_eval on Nomic Embed v1.5.
  # Raise for stricter gating; lower if your provider's score
  # distribution differs.
  weak_evidence_score_threshold: 0.46

  # Relevance-aware warning emission (#161). The per-chunk security
  # warnings — `sensitive_content`, `prompt_injection_pattern`, and
  # the same-heading `conflicting_sources` detector — gate on BOTH
  # of these knobs so a flagged chunk that landed in top-K via cosine
  # noise on an unrelated query doesn't crater precision:
  #
  #   * `relevance_floor` — fused-score floor a chunk must clear to
  #     count toward the per-chunk warnings. Leave unset (null) to
  #     track `weak_evidence_score_threshold`; the default is to move
  #     both gates with one knob. Set explicitly to demand a STRICTER
  #     relevance floor on warnings than on weak-evidence (e.g. a
  #     1.5x multiple to require a clear both-arm hit).
  #   * `max_warning_rank` — only the top-N chunks (1-indexed) are
  #     eligible to trip. Default 3 keeps a tight head-of-list gate;
  #     a flagged chunk at rank 7 on a clean query is treated as
  #     cosine noise rather than a security signal.
  #
  # The high-relevance security guarantee is preserved: a sensitive
  # chunk at rank 1 with a both-arm RRF score still trips. See
  # docs/security.md for the policy framing.
  # relevance_floor: 0.69   # 1.5x weak_evidence_score_threshold
  max_warning_rank: 3
