---
# Source allowlist. Copy to config/sources.yaml (gitignored) and customize.
# Ingestion will refuse to fetch sources not listed here.
#
# Each source must declare its trust level. Sources without a status
# are treated as `draft` and de-prioritized in retrieval.

sources:
  - name: internal-docs
    type: git
    repo: owner/internal-docs            # change to your repo
    branch: main
    include:
      - "docs/**/*.md"
      - "README.md"
    exclude:
      - "**/node_modules/**"
      - "**/.git/**"
      - "**/*draft*.md"
      # `docs/_eval/` is the kiln's review-precision eval corpus —
      # deliberately contains a conflict pair, a deprecated runbook,
      # a sensitive marker, and a prompt-injection trap. The eval
      # harness ingests it on its own; never let it land in a real
      # operator's index. (#108)
      - "docs/_eval/**"
    status: active
    authority: standard
    default_owner: platform
    default_sensitivity: internal
    last_reviewed_required: false

  - name: platform-runbooks
    type: git
    repo: owner/platform-runbooks            # change to your repo
    branch: main
    include:
      - "docs/**/*.md"
      - "runbooks/**/*.md"
      - "AGENTS.md"
    exclude:
      - "docs/generated/**"
    status: active
    authority: standard
    default_owner: platform
    default_sensitivity: internal
